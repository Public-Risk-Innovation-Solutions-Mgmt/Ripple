name: handler

# Build once, promote. The handler zip is built exactly once, on a commit to
# `aws`, and stored as a GitHub pre-release keyed by commit SHA (workflow
# artifacts expire; a release does not). Review deploys that same zip
# immediately; prod later deploys the IDENTICAL zip for a tagged commit, never
# a rebuild from source. See AWS_HANDLER_HANDOFF.md / docs/handoff for why.

on:
  pull_request:
    branches: [aws]
  push:
    branches: [aws]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: handler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- pull requests: prove it, deploy nothing ---------------------------
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      # The real acceptance test (docs/handoff/AWS_HANDLER_HANDOFF.md): the
      # same 144 contract assertions, unmodified, run a third/fourth way
      # against DynamoDB Local in Docker — no AWS credentials involved.
      # ubuntu-latest ships dockerd already running; if this step ever fails
      # with "cannot connect to the Docker daemon", that's the runner, not
      # this workflow.
      - run: npm run contract:dynamo
      # The races and the ordering trap the 144 cannot reach (sequential
      # assertions can't see two transactions overlapping at DynamoDB).
      - run: npm run contract:races

  # ---- a commit lands on aws: build once, store, deploy to review -------
  build:
    if: github.ref == 'refs/heads/aws'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the build-<sha> pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:handler   # produces dist-lambda/handler.zip
      - name: Store the build for promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_SHA}" dist-lambda/handler.zip \
            --prerelease --target "${GITHUB_SHA}" \
            --title "Handler build ${GITHUB_SHA::7}" \
            --notes "Built from ${GITHUB_SHA}"

  deploy-review:
    needs: build
    runs-on: ubuntu-latest
    environment: review
    permissions:
      id-token: write   # OIDC token for AWS
      contents: read    # to download the build-<sha> release asset
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168288133197:role/ripple-deploy-review
          aws-region: us-west-2
      - name: Deploy the stored build to review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "build-${GITHUB_SHA}" -R "$GITHUB_REPOSITORY" -p handler.zip
          aws lambda update-function-code --function-name ripple-session \
            --zip-file fileb://handler.zip
          aws lambda wait function-updated-v2 --function-name ripple-session
          # A version per deploy, with the commit it came from in the
          # description — --publish on update-function-code does not take a
          # description, so this is a second call rather than a flag.
          aws lambda publish-version --function-name ripple-session \
            --description "commit ${GITHUB_SHA}"

  # ---- a v* tag is pushed: promote the SAME zip review already ran ------
  #
  # ⚠ NO `needs: build` HERE, DELIBERATELY. On a tag push `build` is skipped
  # (its `if` only matches refs/heads/aws), and a job that needs a skipped
  # job is itself skipped by default regardless of its own `if` — which would
  # silently disable prod deploys entirely. There is also no real dependency:
  # this looks up a build-<sha> release made by an EARLIER run of this
  # workflow (the push to aws that produced the tagged commit), not anything
  # this run builds.
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod   # waits for a required reviewer; self-review blocked
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168288133197:role/ripple-deploy-prod
          aws-region: us-west-2
      - name: Promote the build review already ran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "build-${GITHUB_SHA}" -R "$GITHUB_REPOSITORY" -p handler.zip \
            || { echo "::error::No build-${GITHUB_SHA} release — this commit was never built and deployed to review."; exit 1; }
          aws lambda update-function-code --function-name ripple-session-prod \
            --zip-file fileb://handler.zip
          aws lambda wait function-updated-v2 --function-name ripple-session-prod
          aws lambda publish-version --function-name ripple-session-prod \
            --description "commit ${GITHUB_SHA}"
