name: admin

# Build once, promote — same shape as .github/workflows/handler.yml, for the
# separate admin-accounts Lambda (ADMIN_ACCOUNTS_HANDOFF.md, Option B). A
# commit to `aws` builds dist-lambda/admin-handler.zip once and stores it as
# an admin-build-<sha> pre-release (its own namespace, so it never collides
# with the session handler's build-<sha> releases on the same commit).
# Review deploys that zip immediately; prod later deploys the SAME zip for a
# tagged commit, never a rebuild.

on:
  pull_request:
    branches: [aws]
  push:
    branches: [aws]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- pull requests: prove it, deploy nothing ---------------------------
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      # The real acceptance test: the admin contract check against DynamoDB
      # Local in Docker, in-process and over HTTP through the Lambda handler.
      # No AWS credentials involved. ubuntu-latest ships dockerd already
      # running; if this step ever fails with "cannot connect to the Docker
      # daemon", that's the runner, not this workflow.
      - run: npm run contract:admin

  # ---- a commit lands on aws: build once, store, deploy to review -------
  build:
    if: github.ref == 'refs/heads/aws'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the admin-build-<sha> pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:admin-handler   # produces dist-lambda/admin-handler.zip
      - name: Store the build for promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "admin-build-${GITHUB_SHA}" dist-lambda/admin-handler.zip \
            --prerelease --target "${GITHUB_SHA}" \
            --title "Admin handler build ${GITHUB_SHA::7}" \
            --notes "Built from ${GITHUB_SHA}"

  deploy-review:
    needs: build
    runs-on: ubuntu-latest
    environment: review
    permissions:
      id-token: write   # OIDC token for AWS
      contents: read    # to download the admin-build-<sha> release asset
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168288133197:role/ripple-deploy-admin-review
          aws-region: us-west-2
      - name: Deploy the stored build to review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "admin-build-${GITHUB_SHA}" -R "$GITHUB_REPOSITORY" -p admin-handler.zip
          aws lambda update-function-code --function-name ripple-admin-review \
            --zip-file fileb://admin-handler.zip
          aws lambda wait function-updated-v2 --function-name ripple-admin-review
          aws lambda publish-version --function-name ripple-admin-review \
            --description "commit ${GITHUB_SHA}"

  # ---- a v* tag is pushed: promote the SAME zip review already ran ------
  #
  # ⚠ NO `needs: build` HERE, same reasoning as handler.yml: on a tag push
  # `build` is skipped (its `if` only matches refs/heads/aws), and a job
  # needing a skipped job is itself skipped regardless of its own `if`. This
  # looks up a release made by an EARLIER run of this workflow, not anything
  # this run builds.
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod   # waits for a required reviewer; self-review blocked
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168288133197:role/ripple-deploy-admin-prod
          aws-region: us-west-2
      - name: Promote the build review already ran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "admin-build-${GITHUB_SHA}" -R "$GITHUB_REPOSITORY" -p admin-handler.zip \
            || { echo "::error::No admin-build-${GITHUB_SHA} release — this commit was never built and deployed to review."; exit 1; }
          aws lambda update-function-code --function-name ripple-admin-prod \
            --zip-file fileb://admin-handler.zip
          aws lambda wait function-updated-v2 --function-name ripple-admin-prod
          aws lambda publish-version --function-name ripple-admin-prod \
            --description "commit ${GITHUB_SHA}"
