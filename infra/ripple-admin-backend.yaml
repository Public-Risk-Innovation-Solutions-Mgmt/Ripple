AWSTemplateFormatVersion: '2010-09-09'
# Ripple's admin-accounts backend — a SEPARATE template from
# ripple-backend.yaml, deliberately: ADMIN_ACCOUNTS_HANDOFF.md (Option B)
# chose a separate table and Lambda so nobody who can touch game sessions can
# touch admin accounts, and vice versa. See docs/admin/ and
# src/admin/server/accounts.ts for what the Lambda actually does.
#
# This stack adds routes to the EXISTING session API Gateway (ExistingApiId,
# a parameter — not a cross-stack Export/Import) rather than creating a
# second one: same domain, same CORS configuration, no reason to duplicate
# either. It creates no Api and no Stage resource of its own.
#
# EVERY RESOURCE IS DeletionPolicy/UpdateReplacePolicy: Retain, same posture
# and the same cost as ripple-backend.yaml: deleting a throwaway test stack
# leaves every resource behind. Delete the table (after turning off deletion
# protection), the function, the role, the routes/integration/permission,
# and the log group by hand.
Description: >-
  Ripple admin-accounts backend: DynamoDB table, ripple-admin Lambda and
  role, and routes/integration on the existing session API. Reusable via Env.
Parameters:
  Env:
    Type: String
    Description: >
      Which environment this stack is. Unlike ripple-backend.yaml, nothing
      here already exists under a bare name — review is being created fresh
      by this template too — but the same suffix convention is used for
      consistency with the session backend's resource names.
    AllowedValues: [review, prod, test]
    Default: test

  ExistingApiId:
    Type: String
    Description: The session API Gateway's id (ripple-session-api) that these routes are added to.

  OwnerTag:
    Type: String
    Default: Mike

  ProjectTag:
    Type: String
    Default: ripple

Conditions:
  IsReview: !Equals [!Ref Env, review]
  IsProd: !Equals [!Ref Env, prod]

Resources:
  # ---------------------------------------------------------------- storage
  AdminTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsReview, ripple-admins, !Sub "ripple-admins-${Env}"]
      # ⚠ pk ONLY, NO SORT KEY. Two flat item shapes (ADMIN#<user>,
      # SESSION#<tokenHash>), neither with a family of child items the way a
      # room has — see src/admin/server/dynamo.ts.
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expiresAtSec
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: false
      Tags:
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Env

  # ---------------------------------------------------------------- compute
  AdminLambdaRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !If [IsReview, ripple-admin-lambda-role, !Sub "ripple-admin-lambda-role-${Env}"]
      Path: /
      MaxSessionDuration: 3600
      Description: Allows Lambda functions to call AWS services on your behalf.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # ⚠ SCOPED ONLY TO AdminTable. ripple-session's role never appears
        # here and this role never appears there — that separation is the
        # entire point of Option B.
        - PolicyName: ripple-admins-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RippleAdminsTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt AdminTable.Arn
      Tags:
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Env

  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !If [IsReview, /aws/lambda/ripple-admin, !Sub "/aws/lambda/ripple-admin-${Env}"]
      RetentionInDays: 30
      LogGroupClass: STANDARD
      Tags:
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Env

  AdminFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !If [IsReview, ripple-admin, !Sub "ripple-admin-${Env}"]
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt AdminLambdaRole.Arn
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      PackageType: Zip
      # A placeholder only, same trick as ripple-backend.yaml's SessionFunction
      # — the handler pipeline (.github/workflows/admin.yml) deploys the real
      # build via aws lambda update-function-code.
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            body: JSON.stringify({
              error: {
                code: 'TRANSPORT_FAILURE',
                message: 'Placeholder code from ripple-admin-backend.yaml — the handler pipeline has not deployed the real build yet.',
                retryable: true,
              },
            }),
          });
      Environment:
        Variables:
          ADMIN_TABLE_NAME: !Ref AdminTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref AdminLogGroup
      TracingConfig:
        Mode: PassThrough
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      RecursiveLoop: Terminate
      Tags:
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Env

  # ---------------------------------------------------------------- api
  #
  # ⚠ NO AWS::ApiGatewayV2::Api AND NO Stage HERE. ExistingApiId names the
  # session API (ripple-session-api), already created by ripple-backend.yaml
  # and already serving its $default stage with AutoDeploy — adding a Route
  # to that same Api is all a new route needs; there is nothing else to
  # stand up.
  AdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt AdminFunction.Arn
      PayloadFormatVersion: '2.0'
      ConnectionType: INTERNET
      TimeoutInMillis: 30000

  AdminLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /adminLogin"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  AdminLogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /adminLogout"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  CurrentAdminRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /currentAdmin"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  CreateAdminAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /createAdminAccount"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  ListAdminAccountsRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /listAdminAccounts"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  SetAdminDisabledRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /setAdminDisabled"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  DeleteAdminAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /deleteAdminAccount"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  ResetAdminPasswordRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ExistingApiId
      RouteKey: "POST /resetAdminPassword"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  AdminInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # Any stage, any method, any one of this API's (single-segment) admin
      # routes — one permission covering all eight, same collapsing
      # ripple-backend.yaml already does for the session routes.
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/*"

Outputs:
  FunctionName:
    Value: !Ref AdminFunction
  TableName:
    Value: !Ref AdminTable
