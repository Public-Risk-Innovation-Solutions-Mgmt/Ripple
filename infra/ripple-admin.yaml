AWSTemplateFormatVersion: '2010-09-09'
# Ripple's admin-accounts backend — a SEPARATE template from
# ripple-backend.yaml, deliberately: ADMIN_ACCOUNTS_HANDOFF.md (Option B)
# chose a separate table and Lambda so nobody who can touch game sessions can
# touch admin accounts, and vice versa. See src/admin/server/accounts.ts for
# what the Lambda actually does.
#
# ⚠ EVERY NAME IS SUFFIXED -${Env}, REVIEW INCLUDED — unlike
# ripple-backend.yaml, where review's resources already existed by hand
# before any template did. Nothing here pre-exists anywhere; review is
# created fresh by this template exactly like prod is, so there is no bare-
# name case to carve out.
#
# This stack adds routes to the EXISTING session API Gateway (ApiId, a plain
# parameter — not a cross-stack Export/Import) rather than creating a second
# one: same domain, same CORS configuration, no reason to duplicate either.
# It creates no Api and no Stage resource of its own.
#
# EVERY RESOURCE IS DeletionPolicy/UpdateReplacePolicy: Retain, same posture
# as ripple-backend.yaml.
Description: >-
  Ripple admin-accounts backend: DynamoDB table, ripple-admin Lambda and
  role, and routes/integration on the existing session API. Per Env.
Parameters:
  Env:
    Type: String
    Description: Which environment this stack is. Used in every resource name.
    AllowedValues: [review, prod]

  ApiId:
    Type: String
    Description: >-
      The session API Gateway's id that the admin routes are added to —
      review's is l1g9kw9swc, prod's is slb9jb7bt0.

Conditions:
  IsProd: !Equals [!Ref Env, prod]

Resources:
  # ---------------------------------------------------------------- storage
  AdminTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "ripple-admins-${Env}"
      # ⚠ pk ONLY, NO SORT KEY. Two flat item shapes:
      #   ADMIN#<username, lowercased>   the account — no expiry, never swept
      #   SESSION#<sha256(token)>        a login — DOES expire, see below
      # See src/admin/server/dynamo.ts.
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # ⚠ TTL IS ON, ON expiresAtSec — ACCOUNTS JUST NEVER CARRY THE
      # ATTRIBUTE. Only SESSION# items set expiresAtSec (a 30-day login,
      # src/admin/server/dynamo.ts's ADMIN_SESSION_TTL_SEC default); ADMIN#
      # account items never do, so TTL never touches them. Leaving TTL off
      # at the table level would not be a security problem — the handler
      # independently refuses an expired token's logical check regardless —
      # but expired sessions would then sit in the table forever instead of
      # being swept, which is the one thing TTL is actually for here.
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expiresAtSec
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: false
      Tags:
        - Key: Owner
          Value: Mike
        - Key: Project
          Value: ripple
        - Key: Environment
          Value: !Ref Env

  # ---------------------------------------------------------------- compute
  AdminLambdaRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub "ripple-admin-lambda-role-${Env}"
      Path: /
      MaxSessionDuration: 3600
      Description: Allows Lambda functions to call AWS services on your behalf.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # ⚠ SCOPED ONLY TO AdminTable. ripple-session's role never appears
        # here and this role never appears there — that separation is the
        # entire point of Option B. No secret/Secrets Manager permission is
        # needed — see the "no signing key" note on AdminFunction below.
        - PolicyName: ripple-admins-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RippleAdminsTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt AdminTable.Arn
      Tags:
        - Key: Owner
          Value: Mike
        - Key: Project
          Value: ripple
        - Key: Environment
          Value: !Ref Env

  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/ripple-admin-${Env}"
      RetentionInDays: 30
      LogGroupClass: STANDARD
      Tags:
        - Key: Owner
          Value: Mike
        - Key: Project
          Value: ripple
        - Key: Environment
          Value: !Ref Env

  AdminFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub "ripple-admin-${Env}"
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt AdminLambdaRole.Arn
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      PackageType: Zip
      # A placeholder only, same trick as ripple-backend.yaml's
      # SessionFunction — the handler pipeline (.github/workflows/admin.yml)
      # deploys the real build via aws lambda update-function-code.
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            body: JSON.stringify({
              error: {
                code: 'TRANSPORT_FAILURE',
                message: 'Placeholder code from ripple-admin.yaml — the handler pipeline has not deployed the real build yet.',
                retryable: true,
              },
            }),
          });
      # ⚠ NO SIGNING KEY, NO SECRET, NO SECRETS MANAGER PERMISSION NEEDED.
      # Admin tokens are opaque random strings looked up by their SHA-256
      # hash as a DynamoDB item (SESSION#<hash>) — the same pattern the game
      # backend already uses for host/player/viewer tokens — not a signed
      # token (JWT or similar) that would need a key to verify. Validity is
      # "does this hashed lookup resolve to an unexpired item", not a
      # signature check, so there is nothing to sign and nothing secret to
      # provision. ADMIN_TABLE_NAME is the only required variable;
      # ADMIN_SESSION_TTL_SEC is optional (defaults to 30 days in code) and
      # deliberately not set here — change it by setting the variable, not
      # by editing this template.
      Environment:
        Variables:
          ADMIN_TABLE_NAME: !Ref AdminTable
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref AdminLogGroup
      TracingConfig:
        Mode: PassThrough
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      RecursiveLoop: Terminate
      Tags:
        - Key: Owner
          Value: Mike
        - Key: Project
          Value: ripple
        - Key: Environment
          Value: !Ref Env

  # ---------------------------------------------------------------- api
  #
  # ⚠ NO AWS::ApiGatewayV2::Api AND NO Stage HERE. ApiId names the existing
  # session API (ripple-session-api), already serving its $default stage
  # with AutoDeploy — adding a Route to that same Api is all a new route
  # needs; there is nothing else to stand up.
  #
  # The eight routes, one per endpoint in src/admin/server/handler.ts's
  # ENDPOINTS list — all POST, all AWS_PROXY to the one Lambda below.
  AdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt AdminFunction.Arn
      PayloadFormatVersion: '2.0'
      ConnectionType: INTERNET
      TimeoutInMillis: 30000

  AdminLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /adminLogin"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  AdminLogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /adminLogout"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  CurrentAdminRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /currentAdmin"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  CreateAdminAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /createAdminAccount"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  ListAdminAccountsRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /listAdminAccounts"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  SetAdminDisabledRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /setAdminDisabled"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  DeleteAdminAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /deleteAdminAccount"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  ResetAdminPasswordRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /resetAdminPassword"
      Target: !Sub "integrations/${AdminIntegration}"
      AuthorizationType: NONE
      ApiKeyRequired: false

  AdminInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # Any stage, any method, any one of this API's (single-segment) admin
      # routes — one permission covering all eight, same collapsing
      # ripple-backend.yaml already does for the session routes.
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"

Outputs:
  FunctionName:
    Value: !Ref AdminFunction
  TableName:
    Value: !Ref AdminTable
